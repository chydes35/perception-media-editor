name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install source review dependency
        run: command -v rg || brew install ripgrep
      - name: Swift version
        run: swift --version
      - name: Test and build
        run: ./scripts/qa.sh
