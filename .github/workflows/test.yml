name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Experiment (2026-10-19): the redesign is built against the macOS 26 SDK and fails to compile on
    # macos-15 / Xcode 16.4 (audio tap pointer type, a type-checker timeout, an async API). See PR description.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install source review dependency
        run: command -v rg || brew install ripgrep
      - name: Swift version
        run: swift --version
      - name: Test and build
        run: ./scripts/qa.sh
